name: web / build

on:
  push:
    branches: [dev]
    paths: ["apps/web/**", "me.toml", ".github/workflows/web-build.yml"]
  pull_request:
    paths: ["apps/web/**", "me.toml", ".github/workflows/web-build.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run build
