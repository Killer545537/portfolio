services:
    web:
        build:
            context: .
            dockerfile: ./apps/web/Dockerfile
        container_name: portfolio-web
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=${DATABASE_URL}
            - RESEND_API_KEY=${RESEND_API_KEY:-}
            - RESEND_FROM=${RESEND_FROM:-}
        volumes:
            - ./me.toml:/app/me.toml:ro
        # No healthcheck here: the image has no curl, and the Dockerfile already
        # defines a working one using bun. Overriding it with `curl -f` left the
        # container permanently unhealthy.

    ssh:
        build:
            context: .
            dockerfile: ./apps/ssh/Dockerfile
        container_name: portfolio-ssh
        restart: unless-stopped
        ports:
            - "2222:2222"
        environment:
            - DATABASE_URL=${DATABASE_URL}
            - RESEND_API_KEY=${RESEND_API_KEY:-}
            - RESEND_FROM=${RESEND_FROM:-}
        volumes:
            - ./me.toml:/app/me.toml:ro
            # Persists the SSH host key. Without it every restart hands returning
            # visitors a "REMOTE HOST IDENTIFICATION HAS CHANGED" warning.
            - ssh-host-key:/app/data

volumes:
    ssh-host-key:
