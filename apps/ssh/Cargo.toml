[package]
name = "ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
anyhow = "1.0.105"
russh = "0.65"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net"] }
# Only runtime `sqlx::query()` is used: no macros, migrate or `any`. aws-lc-rs
# is the rustls provider reqwest and russh already pull in, so `ring` stays out.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "json"], default-features = false }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
dotenvy = "0.15.7"
rand = "0.10"
